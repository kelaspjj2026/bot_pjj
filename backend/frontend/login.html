<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bot WhatsApp PJJ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>🤖 Bot WhatsApp PJJ</h2>
        <p>Informatika Udinus</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email / Username</label>
          <input type="text" id="email" placeholder="Masukkan email atau username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <div id="loginError" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');

      if ((email === 'support@latifdev.com' || email === 'admin') && password === 'admin123') {
        localStorage.setItem('bot_admin_logged', 'true');
        localStorage.setItem('bot_admin_user', email);
        window.location.href = 'index.html';
      } else {
        errorEl.textContent = 'Email atau password salah!';
        errorEl.style.display = 'block';
      }
    });

    if (localStorage.getItem('bot_admin_logged') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
